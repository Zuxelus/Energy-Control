plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	/*maven {
		name = "CurseForge"
		url = "https://minecraft.curseforge.com/api/maven"
	}*/
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
	maven {
		url "https://maven.terraformersmc.com/"
	}
	maven {
		name = "BuildCraft"
		url = "https://mod-buildcraft.com/maven"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	// REI pulls its own older fabric-loader, which clashes with ours at runtime
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	// information pages (BuiltinClientPlugin) live in the default plugin, not in the api
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	modRuntimeOnly("me.shedaniel:RoughlyEnoughItems:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	modImplementation "curse.maven:reborncore-237903:3330311"
	modImplementation "curse.maven:techreborn-233564:3330317"
	include(modApi("teamreborn:energy:${project.energy_version}")) {
		transitive = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

// Loom needs Gradle on JDK 25, but the game (runClient, runServer, ...) runs on the Java it targets
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

base {
	archivesName = "${project.mod_id}-${project.loader_name}"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
