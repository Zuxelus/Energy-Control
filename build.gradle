plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	/*maven {
		name = "CurseForge"
		url = "https://minecraft.curseforge.com/api/maven"
	}*/
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
	maven {
		url "https://maven.terraformersmc.com/"
	}
	maven {
		// Placeholder API (transitive dependency of ModMenu)
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
	maven {
		name = "BuildCraft"
		url = "https://mod-buildcraft.com/maven"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth API
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	//implementation "alexiil.mc.lib:${project.lba_version}"
	// REI pulls its own older fabric-loader, which clashes with ours at runtime
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	// information pages (BuiltinClientPlugin) live in the default plugin, not in the api
	compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	// REI's EntryStacks/EntryIngredients overloads mention architectury's FluidStack, which REI only declares for runtime
	compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
	runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	implementation "curse.maven:reborncore-237903:8888168"
	implementation "curse.maven:techreborn-233564:8888169"
	include(api("teamreborn:energy:${project.energy_version}")) {
		transitive = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

base {
	archivesName = "${project.mod_id}-${project.loader_name}"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
