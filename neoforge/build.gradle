apply plugin: 'com.github.johnrengelman.shadow'
architectury { platformSetupLoomIde(); neoForge() }
configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile; dependsOn shadowJar }
sourcesJar { from project(':common').sourceSets.main.allSource }
loom.runs {
    client {
        runDir rootProject.hasProperty('qaStage') ? (rootProject.hasProperty('qaObserver')?'run/client-v3-observer':'run/client-v3') : 'run/client'
        vmArg '-Xmx2G'; programArg '--width'; programArg '1280'; programArg '--height'; programArg '720'
        if(rootProject.hasProperty('qaStage')) { vmArg "-Dec.qa.stage=${rootProject.qaStage}"; programArg '--username'; programArg rootProject.hasProperty('qaObserver')?'ECObserver':'ECEditor' }
        if(rootProject.hasProperty('qaObserver'))vmArg '-Dec.qa.observer=true'
    }
    server {
        runDir rootProject.hasProperty('qaStage')?'run/server-v3':'run/server';vmArg '-Xmx2G';programArg '--nogui'
        if(rootProject.hasProperty('qaStage'))vmArg "-Dec.qa.stage=${rootProject.qaStage}"
    }
}

// Explicitly authorized optional integration QA; never a production dependency.
if(rootProject.hasProperty('ieQa')) {
    if(!rootProject.hasProperty('qa')) throw new GradleException('ieQa requires qa')
    def ieJar=rootProject.file('.tools/integrations/ie/ImmersiveEngineering-1.21.1-12.4.2-194.jar')
    if(!ieJar.isFile()) throw new GradleException('Approved IE artifact missing; see docs/integration-research')
    def digest=java.security.MessageDigest.getInstance('SHA-256').digest(ieJar.bytes).encodeHex().toString()
    if(digest!='816685b898eed52080d08a4009042c511560ecc185601f21fe744936b63b5127') throw new GradleException('IE artifact hash mismatch')
    def embedded = [
        'BlockModelSplitter-2.0.1.jar':'ab752fbe975e4c6af2679d0f8b85dfb7ebe3da3aa04a73951e3b5bfbc3f40537',
        'DualCodecs-0.1.2.jar':'0bddfcac4d409803a35cbbd5c7b74828f436357ad7b8980fcfbd5a1834c05feb'
    ].collect { name, expected ->
        def f=rootProject.file('.tools/integrations/ie/embedded/'+name)
        if(!f.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()!=expected) throw new GradleException('Approved IE embedded library missing/hash mismatch: '+name)
        f
    }
    dependencies { modImplementation files(ieJar); modImplementation files(embedded) }
    sourceSets.main.java.srcDir 'src/ieqa/java'
    loom.runs {
        client { runDir 'run/client-ie-v4' }
        server { runDir 'run/server-ie-v4' }
    }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('pages')) {
    loom.runs { client { runDir 'run/client-pages-v4' }; server { runDir 'run/server-pages-v4' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('graphics')) {
    loom.runs { client { runDir rootProject.hasProperty('qaObserver')?'run/client-graphics-v5-observer':'run/client-graphics-v5' }; server { runDir 'run/server-graphics-v5' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('ie-special')) {
    loom.runs { client { runDir rootProject.hasProperty('qaObserver')?'run/client-ie-special-v5-observer':'run/client-ie-special-v5' }; server { runDir 'run/server-ie-special-v5' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('inventory')) {
    loom.runs { client { runDir rootProject.hasProperty('qaObserver')?'run/client-inventory-observer':'run/client-inventory' }; server { runDir 'run/server-inventory' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('slopes')) {
    loom.runs { client { runDir rootProject.hasProperty('qaObserver')?'run/client-slopes-observer':'run/client-slopes' }; server { runDir 'run/server-slopes' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('ie-special-v6')) {
    loom.runs { client { runDir rootProject.hasProperty('qaObserver')?'run/client-ie-special-v6-observer':'run/client-ie-special-v6' }; server { runDir 'run/server-ie-special-v6' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString().startsWith('ie-special-kit')) {
    loom.runs { client { runDir 'run/client-ie-kit-v6' }; server { runDir 'run/server-ie-kit-v6' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString()=='ie-special-kit-muted') {
    loom.runs { client { runDir 'run/client-ie-kit-muted' }; server { runDir 'run/server-ie-kit-muted' } }
}

if(rootProject.hasProperty('qaStage') && rootProject.qaStage.toString()=='ie-special-kit-final') {
    loom.runs { client { runDir 'run/client-ie-kit-final' }; server { runDir 'run/server-ie-kit-final' } }
}
