pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Lets Gradle auto-download the JDK 16 toolchain used by runClient/runServer
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
